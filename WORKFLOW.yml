name: family-sports-collector
on:
  schedule:
    # Main sync every 5 minutes. Event/team discovery once a day at 9:05 UTC.
    - cron: "*/5 * * * *"
    - cron: "5 9 * * *"
  workflow_dispatch:
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run collector
        env:
          COLLECTOR_TOKEN: ${{ secrets.COLLECTOR_TOKEN }}
          DISCOVERY: ${{ github.event.schedule == '5 9 * * *' && '1' || '' }}
        run: python3 collector.py
